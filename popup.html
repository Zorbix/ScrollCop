<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ScrollCop</title><link rel="stylesheet" href="styles.css"></head>
<body class="popup">
  <header class="brand"><img class="logo" src="badge.svg" width="30" height="35" alt="" aria-hidden="true"><span>ScrollCop</span><span class="edition">YOUR FOCUS, FIRST</span></header>
  <main>
    <h1>A little less<br>distraction</h1>
    <section class="control-card"><div><h2>Put distractions behind bars</h2><p id="master-description">Loading your settings…</p></div><label class="switch"><input id="master-toggle" type="checkbox" aria-label="Block distractions" disabled><span></span></label></section>
    <div class="status"><span id="status-dot" class="dot"></span><span id="status-text" role="status">Getting ready…</span></div>
    <button id="open-options" class="options-button"><span class="gear" aria-hidden="true">⚙</span><span>Manage blocked websites</span><span aria-hidden="true">↗</span></button>
    <p id="error" class="error" role="alert"></p>
  </main>
  <footer>© <a href="https://dvorakpetr.eu" target="_blank" rel="noopener noreferrer">dvorakpetr.eu</a></footer>
  <script type="module" src="ui.js"></script>
</body></html>
